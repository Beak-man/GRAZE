# Build GRAZE and publish it to GitHub Pages.
#
# This workflow is deliberately dumb. Every piece of acquisition logic —
# conditional requests, retries, validation, the refusal to publish an empty
# file — lives in scripts/fetch-socrates.mjs so that swapping GitHub Actions
# for any other scheduler needs no code change. If you find yourself adding
# logic here, it belongs in the script instead.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Skip the cache so the SOCRATES fetch is unconditional'
        type: boolean
        default: false
  schedule:
    # Every 8 hours. SOCRATES only regenerates a few times a day, so polling
    # harder gains nothing and risks CelesTrak blocking the client.
    - cron: '0 */8 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys rather than cancelling them: a scheduled run and a push run
# must not race, and cancelling mid-deploy can leave Pages half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      # Restores the previous run's ETag/Last-Modified AND the baked data file.
      # Both are needed together: caching only the metadata invites a 304 with
      # no file to reuse. The key is unique per run with a shared restore prefix
      # so the cache rolls forward — a fixed key would be written once and the
      # stored ETag would freeze forever.
      - name: Restore SOCRATES cache
        if: ${{ !inputs.force_refresh }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .cache
            packages/conjunction-web/public/data/socrates.json
          key: socrates-${{ github.run_id }}
          restore-keys: socrates-

      - name: Install dependencies
        run: npm ci

      # STRICT_DATA=1 on every trigger: a bad upstream must fail loudly and
      # leave the last good deployment live. Publishing a data-less artifact is
      # worse than not publishing, because the client would then auto-fetch the
      # full CSV once per visitor.
      - name: Build
        run: npm run build
        env:
          STRICT_DATA: '1'
          # Optional CORS proxy origin. Empty means the browser calls CelesTrak
          # directly, which works today (they send Access-Control-Allow-Origin: *
          # on SOCRATES). Kept as a seam so a fork, or a future CORS tightening,
          # is a repository-variable change rather than a code change.
          VITE_CELESTRAK_BASE: ${{ vars.VITE_CELESTRAK_BASE }}

      # Surface data freshness two ways, on purpose:
      #  - $GITHUB_STEP_SUMMARY renders on the run's web page, but that buffer
      #    is NOT exposed by the REST API or `gh run view --log`.
      #  - stdout is, so these values stay greppable for an unattended deploy.
      # Both are wanted; do not collapse this into one.
      - name: Summarize baked data
        if: always()
        run: |
          FILE=packages/conjunction-web/public/data/socrates.json
          if [ -f "$FILE" ]; then
            node -e '
              const d = require("./" + process.argv[1]);
              const rows = [
                ["sourceLastModified", d.sourceLastModified ?? "unknown"],
                ["socratesEpoch", d.socratesEpoch ?? "none in CSV"],
                ["recordCount", String(d.recordCount)],
                ["generatedAt", d.generatedAt],
                ["sourceUrl", d.sourceUrl],
              ];
              // Greppable, one key=value per line.
              for (const [k, v] of rows) console.log(`SOCRATES_${k}=${v}`);
              // Markdown for the run page.
              const md = ["### SOCRATES data", "", "| field | value |", "| --- | --- |"]
                .concat(rows.map(([k, v]) => `| ${k} | \`${v}\` |`))
                .join("\n");
              require("node:fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, md + "\n");
            ' "$FILE"
          else
            echo "SOCRATES_status=no baked data file was produced"
            echo "### SOCRATES data
          No baked data file was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: packages/conjunction-web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      # Dead-man's switch. Scheduled workflows auto-disable after 60 days of
      # repository inactivity, and a dead scheduler is otherwise invisible until
      # someone notices the stale-data banner — by which point every visitor who
      # clicks "Fetch latest" is being sent straight to CelesTrak. An external
      # monitor (healthchecks.io, Better Stack, Cronitor, …) that expects a ping
      # every 8h turns that silence into an alert.
      #
      # Skipped when the secret is absent, so forks are unaffected and the
      # workflow stays portable. `|| true` keeps a monitoring outage from
      # failing an otherwise good deploy.
      - name: Ping healthcheck
        if: success() && env.HEALTHCHECK_URL != ''
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: curl -fsS --retry 3 "$HEALTHCHECK_URL" || true
