# Build GRAZE and publish it to GitHub Pages.
#
# This workflow is deliberately dumb. Every piece of acquisition logic —
# conditional requests, retries, validation, the refusal to publish an empty
# file — lives in scripts/fetch-socrates.mjs so that swapping GitHub Actions
# for any other scheduler needs no code change. If you find yourself adding
# logic here, it belongs in the script instead.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Skip the cache so the SOCRATES fetch is unconditional'
        type: boolean
        default: false
  schedule:
    # Every 8 hours. SOCRATES only regenerates a few times a day, so polling
    # harder gains nothing and risks CelesTrak blocking the client.
    - cron: '0 */8 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys rather than cancelling them: a scheduled run and a push run
# must not race, and cancelling mid-deploy can leave Pages half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm

      # Restores the previous run's ETag/Last-Modified AND the baked data file.
      # Both are needed together: caching only the metadata invites a 304 with
      # no file to reuse. The key is unique per run with a shared restore prefix
      # so the cache rolls forward — a fixed key would be written once and the
      # stored ETag would freeze forever.
      - name: Restore SOCRATES cache
        if: ${{ !inputs.force_refresh }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache
            packages/conjunction-web/public/data/socrates.json
          key: socrates-${{ github.run_id }}
          restore-keys: socrates-

      - name: Install dependencies
        run: npm ci

      # STRICT_DATA=1 on every trigger: a bad upstream must fail loudly and
      # leave the last good deployment live. Publishing a data-less artifact is
      # worse than not publishing, because the client would then auto-fetch the
      # full CSV once per visitor.
      - name: Build
        run: npm run build
        env:
          STRICT_DATA: '1'
          # Optional CORS proxy origin. Empty means the browser calls CelesTrak
          # directly, which works today (they send Access-Control-Allow-Origin: *
          # on SOCRATES). Kept as a seam so a fork, or a future CORS tightening,
          # is a repository-variable change rather than a code change.
          VITE_CELESTRAK_BASE: ${{ vars.VITE_CELESTRAK_BASE }}

      # Surface data freshness in the Actions tab so staleness is visible
      # without opening the site.
      - name: Summarize baked data
        if: always()
        run: |
          FILE=packages/conjunction-web/public/data/socrates.json
          {
            echo "### SOCRATES data"
            if [ -f "$FILE" ]; then
              node -e '
                const d = require("./" + process.argv[1]);
                console.log("- sourceLastModified: `" + (d.sourceLastModified ?? "unknown") + "`");
                console.log("- socratesEpoch: `" + (d.socratesEpoch ?? "none in CSV") + "`");
                console.log("- recordCount: `" + d.recordCount + "`");
                console.log("- generatedAt: `" + d.generatedAt + "`");
                console.log("- sourceUrl: " + d.sourceUrl);
              ' "$FILE"
            else
              echo "No baked data file was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: packages/conjunction-web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
